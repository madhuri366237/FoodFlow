# Serves the React build and forwards API calls to the Spring Boot container.
#
# The browser only ever talks to this one origin (http://localhost:3000):
#   /            -> static files from the React build
#   /api/...     -> http://backend:8080/api/...   ("backend" = the Compose service name)
# Same origin means no CORS is needed, just like the Vite proxy in development.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;   # don't advertise the Nginx version
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and Swagger go to the backend. (Swagger UI pages need scripts that the strict
    # CSP below would block, so proxied responses keep the backend's own headers.)
    location ~ ^/(api/|v3/api-docs|swagger-ui) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in every asset file name (index-B1TGxceu.js), so a file never
    # changes under the same name and can be cached "forever".
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: /orders/5 is a React route, not a file. Serve index.html and let React
    # Router render it. index.html itself is never cached, so a new deployment shows up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
