# Included by every location in nginx.conf. (Nginx drops server-level add_header directives in
# any location that declares its own add_header, so the headers are kept in this single file.)
#
#  - CSP: scripts and styles only from this origin, so injected <script> tags won't run.
#    This matters because the JWT lives in localStorage (see src/utils/tokenStorage.js).
#  - nosniff / DENY framing / referrer policy: hardening against MIME confusion,
#    clickjacking and leaking URLs to other sites.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
